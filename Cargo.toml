[package]
name = "boomux"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["all-widgets", "crossterm", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
