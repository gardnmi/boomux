[package]
name = "boomux"
version = "1.9.2"
edition = "2024"
license = "MIT"

[features]
benchmark-internals = []

[dependencies]
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
futures-util = "0.3"
libc = "0.2"
nix = { version = "0.28", default-features = false, features = ["socket", "uio"] }
portable-pty = "0.9"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
shell-words = "1"
toml = "0.9"
toml_edit = "0.25"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4", "v5"] }
unicode-width = "0.2"
vt100 = "=0.16.2"

[dev-dependencies]
criterion = "0.8.2"
gungraun = "0.19.4"
tungstenite = "0.29"

[profile.bench]
debug = true

[[bench]]
name = "core_cpu"
harness = false
required-features = ["benchmark-internals"]

[[bench]]
name = "core_instructions"
harness = false
required-features = ["benchmark-internals"]

[[bench]]
name = "wire"
harness = false

[[test]]
name = "benchmark_harness"
path = "tests/benchmark_harness.rs"
required-features = ["benchmark-internals"]
