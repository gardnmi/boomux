name: macOS preview

on:
  push:
    branches: [feature/macos]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-preview-v1
          cache-on-failure: true
      - name: Probe native executable and process APIs
        run: |
          uname -m
          python3 - <<'PYCODE'
          import ctypes, os, subprocess
          libc = ctypes.CDLL(None)
          print("identity signal API:", getattr(libc, "proc_signal_with_audittoken", None))
          fd = os.open("/bin/echo", os.O_RDONLY)
          try:
              result = subprocess.run([f"/dev/fd/{fd}", "descriptor-exec-ok"], pass_fds=(fd,), capture_output=True, text=True)
              print("descriptor exec:", result.returncode, result.stdout, result.stderr)
          except OSError as error:
              print("descriptor exec unavailable:", error)
          finally:
              os.close(fd)
          PYCODE
      - name: Check backend
        run: cargo +stable check --locked --all-targets
      - name: Test descriptor transfer
        run: cargo +stable test --locked --lib fd_transfer -- --test-threads=1
      - name: Test native process identity
        run: cargo +stable test --locked --lib platform::macos::tests -- --test-threads=1 --nocapture
      - name: Test native lifecycle and recovery
        env:
          BOOMUX_TEST_DIAGNOSTICS: "1"
        run: |
          failed=0
          for scenario in \
            native_daemon_handoffs_multiple_detached_shells \
            daemon_bounds_stalled_connections_and_recovers_capacity \
            explicit_executable_handoff_preserves_live_runs_and_rolls_back_on_failure \
            attachment_client_reconnects_across_daemon_restart \
            graceful_restart_preserves_exited_run_and_terminal_state \
            native_daemon_recovers_reproducible_metadata_after_restart \
            graceful_restart_preserves_opencode_shared_runtime_and_stop_cleans_it_up \
            graceful_restart_transfers_live_kiro_holder_authority_and_rolls_back_safely; do
            cargo +stable test --locked --test native_backend "$scenario" -- --test-threads=1 --nocapture || failed=1
          done
          exit "$failed"
      - name: Check Desktop
        run: cargo +stable check --locked -p boomux-desktop
      - name: Build preview executables
        run: cargo +stable build --release --locked -p boomux -p boomux-desktop
      - name: Package preview
        run: python3 desktop/scripts/package-macos.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boomux-macos-preview
          path: |
            dist/macos/*.zip
            dist/macos/*.sha256
          if-no-files-found: error
          retention-days: 30
