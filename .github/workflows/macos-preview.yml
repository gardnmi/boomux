name: macOS preview

on:
  push:
    branches: [feature/macos]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-preview-v1
          cache-on-failure: true
      - name: Check backend
        run: cargo +stable check --locked --all-targets
      - name: Check Desktop
        run: cargo +stable check --locked -p boomux-desktop
      - name: Test descriptor transfer
        run: cargo +stable test --locked --lib fd_transfer -- --test-threads=1
      - name: Test detached handoff
        run: cargo +stable test --locked --test native_backend native_daemon_handoffs_multiple_detached_shells -- --test-threads=1 --nocapture
      - name: Build preview executables
        run: cargo +stable build --release --locked -p boomux -p boomux-desktop
      - name: Package preview
        run: python3 desktop/scripts/package-macos.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boomux-macos-preview
          path: |
            dist/macos/*.zip
            dist/macos/*.sha256
          if-no-files-found: error
          retention-days: 30
