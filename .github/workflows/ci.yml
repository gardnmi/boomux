name: CI

on:
  pull_request:
  workflow_dispatch:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  changes:
    name: Classify changes
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    outputs:
      run_code: ${{ steps.classify.outputs.run_code }}
      run_desktop: ${{ steps.classify.outputs.run_desktop }}
      run_package: ${{ steps.classify.outputs.run_package }}
      run_benchmarks: ${{ steps.classify.outputs.run_benchmarks }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify shared release version
        run: python3 .github/scripts/check-workspace-version.py

      - name: Test CI selection and artifact provenance
        run: python3 -m unittest discover -s .github/scripts -p 'test_ci_*.py'

      - name: Select required validation
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/classify-ci.py

  rust:
    name: Rust
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      RUN_CODE: ${{ needs.changes.result == 'success' && needs.changes.outputs.run_code == 'false' && 'false' || 'true' }}
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Skip code checks when covered or not required
        if: env.RUN_CODE != 'true'
        run: printf 'Rust checks are covered by base CI or not needed; see Classify changes.\n'

      - name: Check out repository
        if: env.RUN_CODE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        if: env.RUN_CODE == 'true'
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Cache Rust dependencies
        if: env.RUN_CODE == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ubuntu-24.04-checks
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check formatting
        if: env.RUN_CODE == 'true'
        run: cargo fmt --all -- --check

      - name: Verify CLI dependency boundary
        if: env.RUN_CODE == 'true'
        run: |
          cargo tree -p boomux --locked --edges normal,build --prefix none --format '{p}' > cli-dependencies.txt
          python3 - <<'PYCODE'
          from pathlib import Path
          names = {line.split()[0] for line in Path('cli-dependencies.txt').read_text().splitlines()}
          forbidden = {name for name in names if name.startswith(('gpui', 'libghostty-vt'))}
          if forbidden:
              raise SystemExit(f'CLI acquired Desktop dependencies: {sorted(forbidden)}')
          PYCODE

      - name: Run Clippy
        if: env.RUN_CODE == 'true'
        run: cargo clippy -p boomux --all-targets --all-features --locked -- -D warnings

      - name: Run Rust unit tests
        if: env.RUN_CODE == 'true'
        run: cargo test -p boomux --lib --bins --locked -- --test-threads=1

      - name: Run configuration CLI tests
        if: env.RUN_CODE == 'true'
        run: cargo test -p boomux --test config_cli --locked -- --test-threads=1

      - name: Run native backend tests
        if: env.RUN_CODE == 'true'
        run: cargo test -p boomux --test native_backend --locked -- --test-threads=1

  dependency-policy:
    name: Dependency policy
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      RUN_CODE: ${{ needs.changes.result == 'success' && needs.changes.outputs.run_code == 'false' && 'false' || 'true' }}
    steps:
      - name: Skip dependency checks when covered or not required
        if: env.RUN_CODE != 'true'
        run: printf 'Dependency checks are covered by base CI or not needed; see Classify changes.\n'

      - name: Check out repository
        if: env.RUN_CODE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit advisories, licenses, and dependency sources
        if: env.RUN_CODE == 'true'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  benchmarks:
    name: Benchmark smoke
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      RUN_CODE: ${{ needs.changes.result == 'success' && needs.changes.outputs.run_benchmarks == 'false' && 'false' || 'true' }}
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Skip benchmark checks when covered or not required
        if: env.RUN_CODE != 'true'
        run: printf 'Benchmark checks are covered by base CI or not needed; see Classify changes.\n'

      - name: Check out repository
        if: env.RUN_CODE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        if: env.RUN_CODE == 'true'
        run: rustup toolchain install stable --profile minimal

      - name: Cache Rust dependencies
        if: env.RUN_CODE == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ubuntu-24.04-benchmarks
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Validate deterministic benchmark fixtures
        if: env.RUN_CODE == 'true'
        run: cargo test -p boomux --test benchmark_harness --features benchmark-internals --locked

      - name: Smoke test Criterion benchmarks
        if: env.RUN_CODE == 'true'
        run: cargo bench -p boomux --bench core_cpu --bench wire --features benchmark-internals --locked -- --test

  integrations:
    name: Integrations
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      RUN_CODE: ${{ needs.changes.result == 'success' && needs.changes.outputs.run_code == 'false' && 'false' || 'true' }}
    steps:
      - name: Skip integration checks when covered or not required
        if: env.RUN_CODE != 'true'
        run: printf 'Integration checks are covered by base CI or not needed; see Classify changes.\n'

      - name: Check out repository
        if: env.RUN_CODE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        if: env.RUN_CODE == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Verify embedded web terminal assets
        if: env.RUN_CODE == 'true'
        run: |
          bun install --frozen-lockfile
          bun run build:web-terminal
          git diff --exit-code -- assets/mobile-web/terminal.js assets/mobile-web/terminal.css assets/mobile-web/ghostty-vt.wasm

      - name: Run integration tests
        if: env.RUN_CODE == 'true'
        run: bun test ./integrations/opencode/boomux.test.js ./integrations/opencode/boomux-tui.test.js ./integrations/pi/boomux.test.js

      - name: Test shared release versioning
        if: env.RUN_CODE == 'true'
        run: |
          bun install --cwd .github/release-tests --frozen-lockfile
          bun test --cwd .github/release-tests

  release-packaging:
    name: Release packaging (${{ matrix.arch }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    env:
      BOOMUX_DISTRIBUTION: github-release
      RUN_CODE: ${{ needs.changes.result == 'success' && needs.changes.outputs.run_package == 'false' && 'false' || 'true' }}
      RUSTUP_TOOLCHAIN: stable
      TARGET: ${{ matrix.target }}
    steps:
      - name: Skip release packaging when covered or not required
        if: env.RUN_CODE != 'true'
        run: printf 'Release packaging is covered by base CI or not needed; see Classify changes.\n'

      - name: Check out repository
        if: env.RUN_CODE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        if: env.RUN_CODE == 'true'
        run: rustup toolchain install stable --profile minimal

      - name: Cache Rust dependencies
        if: env.RUN_CODE == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}
          key: ubuntu-24.04-release-${{ matrix.target }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Read package version
        if: env.RUN_CODE == 'true'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "boomux") | .version')
          printf 'TAG=v%s\n' "$version" >> "$GITHUB_ENV"

      - name: Build native release binary
        if: env.RUN_CODE == 'true'
        run: cargo build -p boomux --release --locked --target "$TARGET"

      - name: Package and smoke test native release
        if: env.RUN_CODE == 'true'
        run: bash .github/scripts/package-release.sh "$TAG" "$TARGET"

      - name: Record package source
        if: env.RUN_CODE == 'true'
        run: python3 .github/scripts/ci-release-source.py record dist "$(git rev-parse HEAD)" "$TAG" "$TARGET"

      - name: Retain validated release candidate
        if: env.RUN_CODE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/ci-source.json
          retention-days: 14
          if-no-files-found: error

      - name: Validate release scripts
        if: ${{ env.RUN_CODE == 'true' && matrix.arch == 'x86_64' }}
        run: |
          bash -n .github/scripts/package-release.sh .github/scripts/upload-release-assets.sh .github/scripts/update-release-notes.sh .github/scripts/test-update-release-notes.sh packaging/render-installer.sh packaging/test-installer.sh
          sh -n packaging/install-release.sh.in
          bash packaging/test-installer.sh
          bash .github/scripts/test-update-release-notes.sh

  aur-package:
    name: AUR package metadata
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    container: archlinux:base-devel@sha256:68bfc3b0d277b08a99101dc9b94aaa03e5ae70cf1b4fb965c03b2b87b915760d
    env:
      RUN_CODE: ${{ needs.changes.result == 'success' && needs.changes.outputs.run_code == 'false' && 'false' || 'true' }}
    steps:
      - name: Skip AUR validation when covered or not required
        if: env.RUN_CODE != 'true'
        run: printf 'AUR validation is covered by base CI or not needed; see Classify changes.\n'

      - name: Prepare Arch build user
        if: env.RUN_CODE == 'true'
        run: useradd --create-home builder

      - name: Check out repository
        if: env.RUN_CODE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render and validate AUR metadata as an unprivileged user
        if: env.RUN_CODE == 'true'
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -c '
            set -euo pipefail
            cd "$1"
            bash -n packaging/aur/render-pkgbuild.sh packaging/aur/validate-pkgbuild.sh
            tmp=$(mktemp -d)
            printf x86_64 > "$tmp/boomux-v1.2.3-x86_64-unknown-linux-gnu.tar.gz"
            printf aarch64 > "$tmp/boomux-v1.2.3-aarch64-unknown-linux-gnu.tar.gz"
            mkdir "$tmp/first" "$tmp/second"
            packaging/aur/render-pkgbuild.sh 1.2.3 "$tmp/boomux-v1.2.3-x86_64-unknown-linux-gnu.tar.gz" "$tmp/boomux-v1.2.3-aarch64-unknown-linux-gnu.tar.gz" "$tmp/first"
            packaging/aur/render-pkgbuild.sh 1.2.3 "$tmp/boomux-v1.2.3-x86_64-unknown-linux-gnu.tar.gz" "$tmp/boomux-v1.2.3-aarch64-unknown-linux-gnu.tar.gz" "$tmp/second"
            cmp "$tmp/first/PKGBUILD" "$tmp/second/PKGBUILD"
            cmp "$tmp/first/.SRCINFO" "$tmp/second/.SRCINFO"
            cmp "$tmp/first/boomux-bin.install" "$tmp/second/boomux-bin.install"
            packaging/aur/validate-pkgbuild.sh "$tmp/first"
            rm -rf "$tmp"
          ' _ "$GITHUB_WORKSPACE"

  arch-compatibility:
    name: Pinned Arch compatibility
    needs:
      - changes
      - release-packaging
    if: ${{ !cancelled() && needs.release-packaging.result == 'success' }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    container: archlinux:base-devel@sha256:68bfc3b0d277b08a99101dc9b94aaa03e5ae70cf1b4fb965c03b2b87b915760d
    env:
      RUN_CODE: ${{ needs.changes.result == 'success' && needs.changes.outputs.run_package == 'false' && 'false' || 'true' }}
    steps:
      - name: Skip compatibility testing when covered or not required
        if: env.RUN_CODE != 'true'
        run: printf 'Pinned Arch compatibility is covered by base CI or not needed; see Classify changes.\n'

      - name: Download x86_64 release package
        if: env.RUN_CODE == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-x86_64-unknown-linux-gnu
          path: dist

      - name: Smoke test Ubuntu-built binary on pinned Arch
        if: env.RUN_CODE == 'true'
        run: |
          archive=$(printf '%s\n' dist/boomux-v*-x86_64-unknown-linux-gnu.tar.gz)
          package=${archive%.tar.gz}
          package=${package#dist/}
          tar -C dist -xzf "$archive"
          dist/"$package"/boomux --version
          dist/"$package"/boomux capabilities --json >/dev/null

  desktop-rust:
    name: Desktop Rust
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUN_CODE: ${{ needs.changes.result == 'success' && needs.changes.outputs.run_desktop == 'false' && 'false' || 'true' }}
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Skip Desktop checks when covered or not required
        if: env.RUN_CODE != 'true'
        run: printf 'Desktop checks are covered by base CI or not needed; see Classify changes.\n'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_CODE == 'true'
      - name: Install build dependencies
        if: env.RUN_CODE == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfontconfig-dev libwayland-dev libx11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: env.RUN_CODE == 'true'
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: env.RUN_CODE == 'true'
        with:
          key: desktop-checks-ubuntu-24.04-zig-0.15.2-baseline-v1
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Check Desktop formatting
        if: env.RUN_CODE == 'true'
        run: cargo fmt --all -- --check
      - name: Run Desktop Clippy
        if: env.RUN_CODE == 'true'
        run: cargo clippy -p boomux-desktop --all-targets --all-features --locked -- -D warnings
      - name: Run Desktop tests
        if: env.RUN_CODE == 'true'
        run: cargo test -p boomux-desktop --locked -- --test-threads=1
      - name: Build Desktop when no bundle is selected
        if: ${{ env.RUN_CODE == 'true' && needs.changes.outputs.run_package == 'false' }}
        run: cargo build -p boomux-desktop --release --locked
      - name: Validate Desktop packaging fixtures
        if: ${{ env.RUN_CODE == 'true' && needs.changes.outputs.run_package != 'false' }}
        run: |
          sh -n desktop/install.sh desktop/packaging/boomux-desktop desktop/scripts/package-release.sh
          python3 desktop/scripts/test-installer.py
          python3 desktop/scripts/test-smoke.py
          python3 -m unittest discover -s desktop/scripts -p 'test_package*.py'

  desktop-bundle:
    needs: [changes, release-packaging, desktop-rust]
    if: ${{ !cancelled() && needs.release-packaging.result == 'success' && needs.desktop-rust.result == 'success' && needs.changes.outputs.run_package != 'false' }}
    uses: ./.github/workflows/desktop-build.yml
    with:
      source-ref: ${{ github.sha }}
      cli-artifact: release-candidate-x86_64-unknown-linux-gnu

  desktop-smoke:
    needs: desktop-bundle
    uses: ./.github/workflows/desktop-smoke.yml
    with:
      source-ref: ${{ github.sha }}

  macos:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run_code != 'false' || needs.changes.outputs.run_desktop != 'false' || needs.changes.outputs.run_package != 'false') }}
    uses: ./.github/workflows/macos.yml

  result:
    name: CI result
    if: always()
    needs: [changes, rust, dependency-policy, benchmarks, integrations, release-packaging, aur-package, arch-compatibility, desktop-rust, desktop-bundle, desktop-smoke, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci-result.py
