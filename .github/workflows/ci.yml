name: CI

on:
  pull_request:
  workflow_dispatch:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  changes:
    name: Classify changes
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    outputs:
      run_code: ${{ steps.classify.outputs.run_code }}
      run_package: ${{ steps.classify.outputs.run_package }}
      run_benchmarks: ${{ steps.classify.outputs.run_benchmarks }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Test CI selection and artifact provenance
        run: python3 -m unittest discover -s .github/scripts -p 'test_ci_*.py'

      - name: Select required validation
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/classify-ci.py

  rust:
    name: Rust
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      RUN_CODE: ${{ needs.changes.result == 'success' && needs.changes.outputs.run_code == 'false' && 'false' || 'true' }}
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Skip code checks when covered or not required
        if: env.RUN_CODE != 'true'
        run: printf 'Rust checks are covered by base CI or not needed; see Classify changes.\n'

      - name: Check out repository
        if: env.RUN_CODE == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        if: env.RUN_CODE == 'true'
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Cache Rust dependencies
        if: env.RUN_CODE == 'true'
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          key: ubuntu-24.04-checks
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check formatting
        if: env.RUN_CODE == 'true'
        run: cargo fmt --all -- --check

      - name: Run Clippy
        if: env.RUN_CODE == 'true'
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run Rust unit tests
        if: env.RUN_CODE == 'true'
        run: cargo test --lib --bins --locked -- --test-threads=1

      - name: Run configuration CLI tests
        if: env.RUN_CODE == 'true'
        run: cargo test --test config_cli --locked -- --test-threads=1

      - name: Run native backend tests
        if: env.RUN_CODE == 'true'
        run: cargo test --test native_backend --locked -- --test-threads=1

  dependency-policy:
    name: Dependency policy
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      RUN_CODE: ${{ needs.changes.result == 'success' && needs.changes.outputs.run_code == 'false' && 'false' || 'true' }}
    steps:
      - name: Skip dependency checks when covered or not required
        if: env.RUN_CODE != 'true'
        run: printf 'Dependency checks are covered by base CI or not needed; see Classify changes.\n'

      - name: Check out repository
        if: env.RUN_CODE == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Audit advisories, licenses, and dependency sources
        if: env.RUN_CODE == 'true'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  benchmarks:
    name: Benchmark smoke
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      RUN_CODE: ${{ needs.changes.result == 'success' && needs.changes.outputs.run_benchmarks == 'false' && 'false' || 'true' }}
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Skip benchmark checks when covered or not required
        if: env.RUN_CODE != 'true'
        run: printf 'Benchmark checks are covered by base CI or not needed; see Classify changes.\n'

      - name: Check out repository
        if: env.RUN_CODE == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        if: env.RUN_CODE == 'true'
        run: rustup toolchain install stable --profile minimal

      - name: Cache Rust dependencies
        if: env.RUN_CODE == 'true'
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          key: ubuntu-24.04-benchmarks
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Validate deterministic benchmark fixtures
        if: env.RUN_CODE == 'true'
        run: cargo test --test benchmark_harness --features benchmark-internals --locked

      - name: Smoke test Criterion benchmarks
        if: env.RUN_CODE == 'true'
        run: cargo bench --bench core_cpu --bench wire --features benchmark-internals --locked -- --test

  integrations:
    name: Integrations
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      RUN_CODE: ${{ needs.changes.result == 'success' && needs.changes.outputs.run_code == 'false' && 'false' || 'true' }}
    steps:
      - name: Skip integration checks when covered or not required
        if: env.RUN_CODE != 'true'
        run: printf 'Integration checks are covered by base CI or not needed; see Classify changes.\n'

      - name: Check out repository
        if: env.RUN_CODE == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Bun
        if: env.RUN_CODE == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Verify embedded web terminal assets
        if: env.RUN_CODE == 'true'
        run: |
          bun install --frozen-lockfile
          bun run build:web-terminal
          git diff --exit-code -- assets/mobile-web/terminal.js assets/mobile-web/terminal.css assets/mobile-web/ghostty-vt.wasm

      - name: Run integration tests
        if: env.RUN_CODE == 'true'
        run: bun test integrations/opencode/boomux.test.js integrations/opencode/boomux-tui.test.js integrations/pi/boomux.test.js

  release-packaging:
    name: Release packaging (${{ matrix.arch }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    env:
      BOOMUX_DISTRIBUTION: github-release
      RUN_CODE: ${{ needs.changes.result == 'success' && needs.changes.outputs.run_package == 'false' && 'false' || 'true' }}
      RUSTUP_TOOLCHAIN: stable
      TARGET: ${{ matrix.target }}
    steps:
      - name: Skip release packaging when covered or not required
        if: env.RUN_CODE != 'true'
        run: printf 'Release packaging is covered by base CI or not needed; see Classify changes.\n'

      - name: Check out repository
        if: env.RUN_CODE == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        if: env.RUN_CODE == 'true'
        run: rustup toolchain install stable --profile minimal

      - name: Cache Rust dependencies
        if: env.RUN_CODE == 'true'
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          shared-key: release-${{ matrix.target }}
          key: ubuntu-24.04-release-${{ matrix.target }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Read package version
        if: env.RUN_CODE == 'true'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "boomux") | .version')
          printf 'TAG=v%s\n' "$version" >> "$GITHUB_ENV"

      - name: Build native release binary
        if: env.RUN_CODE == 'true'
        run: cargo build --release --locked --target "$TARGET"

      - name: Package and smoke test native release
        if: env.RUN_CODE == 'true'
        run: bash .github/scripts/package-release.sh "$TAG" "$TARGET"

      - name: Record package source
        if: env.RUN_CODE == 'true'
        run: python3 .github/scripts/ci-release-source.py record dist "$(git rev-parse HEAD)" "$TAG" "$TARGET"

      - name: Retain validated release candidate
        if: env.RUN_CODE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/ci-source.json
          retention-days: 14
          if-no-files-found: error

      - name: Validate release scripts
        if: ${{ env.RUN_CODE == 'true' && matrix.arch == 'x86_64' }}
        run: |
          bash -n .github/scripts/package-release.sh .github/scripts/upload-release-assets.sh .github/scripts/update-release-notes.sh .github/scripts/test-update-release-notes.sh packaging/render-installer.sh packaging/test-installer.sh
          sh -n packaging/install-release.sh.in
          bash packaging/test-installer.sh
          bash .github/scripts/test-update-release-notes.sh

  aur-package:
    name: AUR package metadata
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    container: archlinux:base-devel@sha256:68bfc3b0d277b08a99101dc9b94aaa03e5ae70cf1b4fb965c03b2b87b915760d
    env:
      RUN_CODE: ${{ needs.changes.result == 'success' && needs.changes.outputs.run_code == 'false' && 'false' || 'true' }}
    steps:
      - name: Skip AUR validation when covered or not required
        if: env.RUN_CODE != 'true'
        run: printf 'AUR validation is covered by base CI or not needed; see Classify changes.\n'

      - name: Prepare Arch build user
        if: env.RUN_CODE == 'true'
        run: useradd --create-home builder

      - name: Check out repository
        if: env.RUN_CODE == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Render and validate AUR metadata as an unprivileged user
        if: env.RUN_CODE == 'true'
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -c '
            set -euo pipefail
            cd "$1"
            bash -n packaging/aur/render-pkgbuild.sh packaging/aur/validate-pkgbuild.sh
            tmp=$(mktemp -d)
            printf x86_64 > "$tmp/boomux-v1.2.3-x86_64-unknown-linux-gnu.tar.gz"
            printf aarch64 > "$tmp/boomux-v1.2.3-aarch64-unknown-linux-gnu.tar.gz"
            mkdir "$tmp/first" "$tmp/second"
            packaging/aur/render-pkgbuild.sh 1.2.3 "$tmp/boomux-v1.2.3-x86_64-unknown-linux-gnu.tar.gz" "$tmp/boomux-v1.2.3-aarch64-unknown-linux-gnu.tar.gz" "$tmp/first"
            packaging/aur/render-pkgbuild.sh 1.2.3 "$tmp/boomux-v1.2.3-x86_64-unknown-linux-gnu.tar.gz" "$tmp/boomux-v1.2.3-aarch64-unknown-linux-gnu.tar.gz" "$tmp/second"
            cmp "$tmp/first/PKGBUILD" "$tmp/second/PKGBUILD"
            cmp "$tmp/first/.SRCINFO" "$tmp/second/.SRCINFO"
            cmp "$tmp/first/boomux-bin.install" "$tmp/second/boomux-bin.install"
            packaging/aur/validate-pkgbuild.sh "$tmp/first"
            rm -rf "$tmp"
          ' _ "$GITHUB_WORKSPACE"

  arch-compatibility:
    name: Pinned Arch compatibility
    needs:
      - changes
      - release-packaging
    if: ${{ !cancelled() && needs.release-packaging.result == 'success' }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    container: archlinux:base-devel@sha256:68bfc3b0d277b08a99101dc9b94aaa03e5ae70cf1b4fb965c03b2b87b915760d
    env:
      RUN_CODE: ${{ needs.changes.result == 'success' && needs.changes.outputs.run_package == 'false' && 'false' || 'true' }}
    steps:
      - name: Skip compatibility testing when covered or not required
        if: env.RUN_CODE != 'true'
        run: printf 'Pinned Arch compatibility is covered by base CI or not needed; see Classify changes.\n'

      - name: Download x86_64 release package
        if: env.RUN_CODE == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-candidate-x86_64-unknown-linux-gnu
          path: dist

      - name: Smoke test Ubuntu-built binary on pinned Arch
        if: env.RUN_CODE == 'true'
        run: |
          archive=$(printf '%s\n' dist/boomux-v*-x86_64-unknown-linux-gnu.tar.gz)
          package=${archive%.tar.gz}
          package=${package#dist/}
          tar -C dist -xzf "$archive"
          dist/"$package"/boomux --version
          dist/"$package"/boomux capabilities --json >/dev/null
