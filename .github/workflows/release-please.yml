name: Release Please

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag for recovery or compatibility validation
        required: true
        type: string

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == github.event.repository.default_branch) }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ inputs.tag || steps.release.outputs.tag_name }}
      release-sha: ${{ steps.release.outputs.sha }}
      source-ref: ${{ steps.dispatch-release.outputs.source-ref || steps.release.outputs.sha }}
      release-published: ${{ steps.dispatch-release.outputs.published }}
    steps:
      - name: Verify triggering CI commit is current
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha=$(gh api "repos/$GH_REPO/commits/$DEFAULT_BRANCH" --jq .sha)
          if [[ "$current_sha" != "$VALIDATED_SHA" ]]; then
            printf 'CI validated %s, but %s is now %s\n' "$VALIDATED_SHA" "$DEFAULT_BRANCH" "$current_sha" >&2
            exit 1
          fi

      - name: Check for pending draft release
        if: ${{ github.event_name == 'workflow_run' }}
        id: pending-draft
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          draft_ids=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.draft == true) | .id' \
            | sed -n '/^[0-9][0-9]*$/p')
          if [[ -n "$draft_ids" ]]; then
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
            printf 'An unpublished draft release exists; deferring the next release proposal.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
          fi

      # A draft created in this run is not discoverable as the latest release.
      # Keep proposal generation out of the release-creation invocation.
      - name: Create merged release
        if: >-
          ${{ (github.event_name == 'workflow_run') &&
              steps.pending-draft.outputs.exists != 'true' }}
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Update release proposal
        if: >-
          ${{ (github.event_name == 'workflow_run') &&
              steps.pending-draft.outputs.exists != 'true' &&
              steps.release.outputs.release_created != 'true' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Verify release source passed triggering CI
        if: ${{ github.event_name == 'workflow_run' && steps.release.outputs.release_created == 'true' }}
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$RELEASE_SHA" != "$VALIDATED_SHA" ]]; then
            printf 'release source %s was not the CI-validated commit %s\n' "$RELEASE_SHA" "$VALIDATED_SHA" >&2
            exit 1
          fi

      - name: Resolve dispatched release source
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
        id: dispatch-release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'release tag must be strict vMAJOR.MINOR.PATCH: %s\n' "$TAG" >&2
            exit 1
          fi
          release_id=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .id 2>/dev/null | sed -n '/^[0-9][0-9]*$/p' || true)
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            release_id=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select((.tag_name == \"$TAG\") or (.draft == true and .name == \"$TAG\")) | .id" | sed -n '/^[0-9][0-9]*$/p')
          fi
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            printf 'could not resolve one release for %s\n' "$TAG" >&2
            exit 1
          fi
          draft=$(gh api "repos/$GH_REPO/releases/$release_id" --jq .draft)
          if [[ "$draft" == true ]]; then
            target_commitish=$(gh api "repos/$GH_REPO/releases/$release_id" --jq .target_commitish)
            source_ref=$(gh api "repos/$GH_REPO/commits/$target_commitish" --jq .sha)
            gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
              -f target_commitish="$source_ref" >/dev/null
            published=false
          else
            source_ref=$TAG
            published=true
          fi
          printf 'source-ref=%s\n' "$source_ref" >> "$GITHUB_OUTPUT"
          printf 'published=%s\n' "$published" >> "$GITHUB_OUTPUT"

  build-release:
    name: Prepare Linux ${{ matrix.arch }} release
    needs: release-please
    if: >-
      ${{ needs.release-please.outputs.release-created == 'true' ||
          (inputs.tag != '' && needs.release-please.outputs.release-published != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    env:
      BOOMUX_DISTRIBUTION: github-release
      RUSTUP_TOOLCHAIN: stable
      TARGET: ${{ matrix.target }}
      TAG: ${{ needs.release-please.outputs.tag-name }}
      SOURCE_REF: ${{ needs.release-please.outputs.source-ref }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Download validated CI release candidate
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-candidate-${{ matrix.target }}
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify CI release provenance and checksum
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          python3 .github/scripts/ci-release-source.py verify dist "$VALIDATED_SHA" "$TAG" "$TARGET"

      # Recovery is explicit. Missing/expired automatic artifacts fail instead
      # of silently rebuilding different bytes for publication.
      - name: Install Rust toolchain for recovery
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: rustup toolchain install stable --profile minimal

      - name: Cache recovery dependencies
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          shared-key: release-${{ matrix.target }}
          key: ubuntu-24.04-release-${{ matrix.target }}
          save-if: false

      - name: Build release binary for recovery
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: cargo build --release --locked --target "$TARGET"

      - name: Package and smoke test recovered release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: bash .github/scripts/package-release.sh "$TAG" "$TARGET"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boomux-${{ env.TAG }}-${{ env.TARGET }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 14
          if-no-files-found: error

  validate-omarchy-boomux:
    name: Validate omarchy-boomux compatibility
    needs:
      - release-please
      - build-release
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag-name }}
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Check out pinned omarchy-boomux
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: gardnmi/omarchy-boomux
          ref: 77a25abfc294bd101901d743c5153e3a13608d20 # v2.8.1
          path: omarchy-boomux
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Download x86_64 release candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: boomux-${{ env.TAG }}-${{ env.TARGET }}
          path: dist

      - name: Validate release candidate
        run: |
          archive="boomux-${TAG}-${TARGET}.tar.gz"
          (
            cd dist
            sha256sum --check "${archive}.sha256"
            tar -xzf "$archive"
          )
          bun omarchy-boomux/scripts/check-boomux-capabilities.js \
            "dist/boomux-${TAG}-${TARGET}/boomux"

  publish-release:
    name: Publish GitHub release assets
    needs:
      - release-please
      - build-release
      - validate-omarchy-boomux
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag-name }}
      SOURCE_REF: ${{ needs.release-please.outputs.source-ref }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Download release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: boomux-${{ env.TAG }}-*
          path: dist
          merge-multiple: true

      - name: Render release installer
        run: packaging/render-installer.sh "$TAG" dist/boomux-installer.sh

      - name: Upload assets to GitHub Release
        run: bash .github/scripts/upload-release-assets.sh "$TAG" dist/*

      - name: Add installation handoff to release notes
        run: bash .github/scripts/update-release-notes.sh "$TAG"

      - name: Publish completed release
        run: |
          release_id=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .id 2>/dev/null | sed -n '/^[0-9][0-9]*$/p' || true)
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            release_id=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select((.tag_name == \"$TAG\") or (.draft == true and .name == \"$TAG\")) | .id" | sed -n '/^[0-9][0-9]*$/p')
          fi
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            printf 'could not resolve one release for %s\n' "$TAG" >&2
            exit 1
          fi
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -f tag_name="$TAG" -F draft=false >/dev/null
          published=$(gh api "repos/$GH_REPO/releases/$release_id" \
            --jq '[.tag_name, (.draft | tostring)] | join("\t")')
          if [[ "$published" != "$TAG"$'\tfalse' ]]; then
            printf 'release publication verification failed for %s\n' "$TAG" >&2
            exit 1
          fi

  validate-published-omarchy-boomux:
    name: Validate published omarchy-boomux compatibility
    if: ${{ inputs.tag != '' && needs.release-please.outputs.release-published == 'true' }}
    needs: release-please
    permissions:
      contents: read
    uses: gardnmi/omarchy-boomux/.github/workflows/boomux-compatibility.yml@77a25abfc294bd101901d743c5153e3a13608d20
    with:
      boomux_tag: ${{ needs.release-please.outputs.tag-name }}
      plugin_ref: 77a25abfc294bd101901d743c5153e3a13608d20
