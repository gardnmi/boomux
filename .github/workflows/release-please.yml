name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ inputs.tag || steps.release.outputs.tag_name }}
      release-sha: ${{ steps.release.outputs.sha }}
      source-ref: ${{ steps.dispatch-release.outputs.source-ref || steps.release.outputs.sha }}
    steps:
      - name: Check for pending draft release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        id: pending-draft
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          draft_ids=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.draft == true) | .id' \
            | sed -n '/^[0-9][0-9]*$/p')
          if [[ -n "$draft_ids" ]]; then
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
            printf 'An unpublished draft release exists; deferring the next release proposal.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Run Release Please
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.tag == '') && steps.pending-draft.outputs.exists != 'true' }}
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Resolve dispatched release source
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
        id: dispatch-release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'release tag must be strict vMAJOR.MINOR.PATCH: %s\n' "$TAG" >&2
            exit 1
          fi
          release_id=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .id 2>/dev/null | sed -n '/^[0-9][0-9]*$/p' || true)
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            release_id=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select((.tag_name == \"$TAG\") or (.draft == true and .name == \"$TAG\")) | .id" | sed -n '/^[0-9][0-9]*$/p')
          fi
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            printf 'could not resolve one release for %s\n' "$TAG" >&2
            exit 1
          fi
          draft=$(gh api "repos/$GH_REPO/releases/$release_id" --jq .draft)
          if [[ "$draft" == true ]]; then
            source_ref=$(gh api "repos/$GH_REPO/releases/$release_id" --jq .target_commitish)
          else
            source_ref=$TAG
          fi
          printf 'source-ref=%s\n' "$source_ref" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build Linux ${{ matrix.arch }} release
    needs: release-please
    if: ${{ needs.release-please.outputs.release-created == 'true' || inputs.tag != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      BOOMUX_DISTRIBUTION: github-release
      RUSTUP_TOOLCHAIN: stable
      TARGET: ${{ matrix.target }}
      TAG: ${{ needs.release-please.outputs.tag-name }}
      SOURCE_REF: ${{ needs.release-please.outputs.source-ref }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Build release binary
        run: cargo build --release --locked --target "$TARGET"

      - name: Package and smoke test release
        run: bash .github/scripts/package-release.sh "$TAG" "$TARGET"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boomux-${{ env.TAG }}-${{ env.TARGET }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release assets
    needs:
      - release-please
      - build-release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag-name }}
      SOURCE_REF: ${{ needs.release-please.outputs.source-ref }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Download release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: boomux-${{ env.TAG }}-*
          path: dist
          merge-multiple: true

      - name: Render release installer
        run: packaging/render-installer.sh "$TAG" dist/boomux-installer.sh

      - name: Upload assets to GitHub Release
        run: bash .github/scripts/upload-release-assets.sh "$TAG" dist/*

      - name: Add installation handoff to release notes
        run: bash .github/scripts/update-release-notes.sh "$TAG"

      - name: Publish completed release
        run: |
          release_id=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .id 2>/dev/null | sed -n '/^[0-9][0-9]*$/p' || true)
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            release_id=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select((.tag_name == \"$TAG\") or (.draft == true and .name == \"$TAG\")) | .id" | sed -n '/^[0-9][0-9]*$/p')
          fi
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            printf 'could not resolve one release for %s\n' "$TAG" >&2
            exit 1
          fi
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -f tag_name="$TAG" -F draft=false >/dev/null
          published=$(gh api "repos/$GH_REPO/releases/$release_id" \
            --jq '[.tag_name, (.draft | tostring)] | join("\t")')
          if [[ "$published" != "$TAG"$'\tfalse' ]]; then
            printf 'release publication verification failed for %s\n' "$TAG" >&2
            exit 1
          fi
