name: Desktop smoke

on:
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  display:
    name: Desktop smoke (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        backend: [x11, wayland]
    steps:
      - name: Check out matching test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - name: Download candidate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: boomux-desktop-linux-x86_64
          path: dist
      - name: Install display and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 dbus xvfb x11-utils weston qemu-user \
            mesa-vulkan-drivers libvulkan1 libegl1 libgl1-mesa-dri fonts-dejavu-core \
            libfontconfig1 libwayland-client0 libx11-6 libxcb-shape0 libxcb-xfixes0 \
            libxkbcommon0 libxkbcommon-x11-0
      - name: Exercise bundled Desktop and Boomux
        env:
          BACKEND: ${{ matrix.backend }}
          CPU_MODEL: ${{ matrix.backend == 'x11' && 'Nehalem' || '' }}
        run: |
          timeout --kill-after=15s 150s \
            python3 desktop/scripts/smoke-desktop.py --backend "$BACKEND" --cpu-model "$CPU_MODEL" \
              --archive dist/boomux-desktop-x86_64-unknown-linux-gnu.tar.gz \
              --output "smoke-results/$BACKEND"
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-smoke-${{ matrix.backend }}
          path: smoke-results/
          if-no-files-found: warn
          retention-days: 14
