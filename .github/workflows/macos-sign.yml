name: Sign macOS distribution candidate

on:
  workflow_dispatch:
    inputs:
      source-sha:
        description: Exact reviewed commit to build (40 lowercase hex characters)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate exact source
        env:
          SOURCE: ${{ inputs.source-sha }}
        run: '[[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Read version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Build and smoke without signing secrets
        run: |
          bun install --frozen-lockfile
          cargo build --release --locked -p boomux -p boomux-desktop
          cargo build --release --locked --example webgpu_gateway
          python3 desktop/scripts/package-macos.py
          python3 desktop/scripts/smoke-macos.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-macos-candidate
          path: dist/macos/release/boomux-desktop-aarch64-apple-darwin.zip
          if-no-files-found: error
          retention-days: 3
  sign:
    if: github.ref == 'refs/heads/main' && vars.MACOS_SIGNING_ENABLED == 'true'
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    # Configure required reviewers and restrict this environment to main.
    environment: macos-signing
    steps:
      # Signing scripts come from the trusted default branch, never input source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-macos-candidate
          path: incoming
      - name: Sign and notarize in an isolated temporary keychain
        env:
          SOURCE: ${{ inputs.source-sha }}
          VERSION: ${{ needs.build.outputs.version }}
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for value in "$CERTIFICATE" "$CERTIFICATE_PASSWORD" "$SIGNING_IDENTITY" "$TEAM_ID" "$APPLE_ID" "$NOTARY_PASSWORD"; do
            test -n "$value" || { echo "Configure all macos-signing secrets before dispatch"; exit 1; }
          done
          keychain="$RUNNER_TEMP/boomux-signing.keychain-db"
          certificate="$RUNNER_TEMP/boomux-signing.p12"
          cleanup() { security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -f "$certificate"; }
          trap cleanup EXIT
          password=$(openssl rand -base64 32)
          echo "::add-mask::$password"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$keychain" >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          xcrun notarytool store-credentials boomux-notary --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$NOTARY_PASSWORD" --keychain "$keychain" >/dev/null
          python3 desktop/scripts/sign-macos.py \
            --archive incoming/boomux-desktop-aarch64-apple-darwin.zip \
            --output signed/boomux-desktop-aarch64-apple-darwin.zip \
            --source "$SOURCE" --version "$VERSION" --identity "$SIGNING_IDENTITY" \
            --team "$TEAM_ID" --profile boomux-notary --keychain "$keychain"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-notarized-macos-candidate
          path: signed/*
          if-no-files-found: error
          retention-days: 14
