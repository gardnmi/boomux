<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0d17">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="A read-only view of Boomux agents across connected nodes.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
    <title>Boomux Agents</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Boomux Agents home">
        <img class="brand-logo" src="icon.svg" alt="" width="44" height="44">
        <span class="brand-copy">
          <strong class="brand-wordmark">BOOMUX</strong>
          <small>AGENT OPERATIONS</small>
        </span>
      </a>
      <div class="header-actions">
        <span class="connection" id="connection-status" role="status">
          <span class="connection-dot" aria-hidden="true"></span>
          <span id="connection-label">Connecting</span>
        </span>
        <button class="install-button" id="install-button" type="button" hidden>Install</button>
      </div>
    </header>

    <main id="main-content" tabindex="-1">
      <section aria-labelledby="dashboard-title">
        <div class="hero">
          <div>
            <p class="eyebrow"><span aria-hidden="true">◆</span> Boomux web</p>
            <h1 id="dashboard-title">Agent activity.</h1>
            <p class="hero-copy" id="viewer-copy">Current work and attention across your Boomux nodes.</p>
          </div>
          <p class="last-updated" id="last-updated">Waiting for first snapshot</p>
        </div>

        <section class="metrics" aria-label="Fleet summary">
          <div class="metric metric-primary"><strong id="count-attention">—</strong><span>Attention</span></div>
          <div class="metric"><strong id="count-active">—</strong><span>Active</span></div>
          <div class="metric"><strong id="count-agents">—</strong><span>Agents</span></div>
          <div class="metric"><strong id="count-stale">—</strong><span>Stale nodes</span></div>
        </section>

        <div class="list-toolbar">
          <div class="filters" role="group" aria-label="Filter agents">
            <button class="filter-button is-selected" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter-button" type="button" data-filter="attention" aria-pressed="false">Attention</button>
            <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
          </div>
          <p id="result-count" aria-live="polite"></p>
        </div>

        <div id="dashboard-state" class="state-panel" role="status">
          <span class="loader" aria-hidden="true"></span>
          <strong>Asking the daemon for a snapshot…</strong>
          <span>This should only take a moment.</span>
        </div>
        <ol class="agent-list" id="agent-list" aria-live="polite" aria-busy="true"></ol>
      </section>

    </main>

    <noscript><p class="noscript">JavaScript is required to view the live agent dashboard.</p></noscript>
    <script type="module" src="app.js"></script>
  </body>
</html>
