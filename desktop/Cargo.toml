[package]
name = "boomux-desktop"
version = "1.11.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/gardnmi/boomux"
description = "A fast native tiling terminal workspace for Boomux"

[dependencies]
async-channel = "2.5"
boomux = { path = ".." }
compact_str = "=0.9.1"
fastrand = "=2.5.0"
gpui = { package = "gpui-ce", version = "=0.2.2" }
gpui_platform = { package = "gpui_ce_platform", version = "=0.1.0", features = ["wayland", "x11"] }
image = { version = "0.25", default-features = false }
libghostty-vt = { version = "=0.2.1", default-features = false, features = ["kitty-graphics"] }
libc = "0.2"
notify = { version = "=8.2.0", default-features = false }
smallvec = "1.15"
toml = "=0.9.12"
toml_edit = "=0.25.13"
serde_json = "=1.0.151"
semver = "=1.0.28"
uuid = { version = "1", features = ["v4"] }
